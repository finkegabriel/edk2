name: Build Debian 12 ARM64 Kernel (Snapdragon 850) with ACPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container:
      image: debian:12

    steps:
      - name: Install build dependencies and ARM64 cross-compiler
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            libssl-dev:arm64 \
            libelf-dev \
            dwarves \
            git \
            cpio \
            kmod \
            libncurses-dev \
            device-tree-compiler \
            u-boot-tools \
            python3 \
            python3-pip

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel-source

      - name: Setup kernel configuration for ARM64 Snapdragon 850
        run: |
          cd kernel-source
          
          # Set cross-compilation environment
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Create or update .config file
          if [ -f .config ]; then
            echo "Using existing .config"
          else
            echo "Creating ARM64 defconfig..."
            # Try different defconfig targets
            if make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- help 2>/dev/null | grep -q defconfig; then
              make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig || true
            elif [ -f arch/arm64/configs/defconfig ]; then
              cp arch/arm64/configs/defconfig .config
            elif [ -f arch/arm64/configs/arm64_defconfig ]; then
              cp arch/arm64/configs/arm64_defconfig .config
            else
              echo "No defconfig found, creating minimal config..."
              # Create a minimal config
              cat > .config << 'EOFCONFIG'
              CONFIG_ARM64=y
              CONFIG_ACPI=y
              CONFIG_ARM64_ACPI_PARKING_PROTOCOL=y
              CONFIG_OF=y
              EOFCONFIG
            fi
          fi
          
          # Enable required ACPI options using sed (works even if scripts/config doesn't exist)
          echo "Enabling ACPI configuration options..."
          
          # Function to set config option
          set_config() {
            local option=$1
            local value=$2
            if grep -q "^${option}=" .config 2>/dev/null; then
              # Option exists, update it
              sed -i "s|^${option}=.*|${option}=${value}|" .config
            else
              # Option doesn't exist, add it
              echo "${option}=${value}" >> .config
            fi
          }
          
          # Enable ACPI options
          set_config "CONFIG_ACPI" "y"
          set_config "CONFIG_ARM64_ACPI_PARKING_PROTOCOL" "y"
          
          # Enable Snapdragon 850 specific options (if they exist in the config)
          set_config "CONFIG_ARCH_QCOM" "y" || true
          set_config "CONFIG_ARM_SMMU" "y" || true
          set_config "CONFIG_QCOM_SCM" "y" || true
          
          # Enable device tree support
          set_config "CONFIG_OF" "y"
          
          # If scripts/config exists, use it for verification
          if [ -f scripts/config ]; then
            echo "Using scripts/config for additional configuration..."
            ./scripts/config --file .config --enable CONFIG_ACPI || true
            ./scripts/config --file .config --enable CONFIG_ARM64_ACPI_PARKING_PROTOCOL || true
          fi
          
          # Verify the configuration
          echo "Verifying configuration..."
          echo "ACPI settings:"
          grep -E "CONFIG_ACPI=|CONFIG_ARM64_ACPI_PARKING_PROTOCOL=" .config || echo "Warning: ACPI configs not found"
          echo ""
          echo "Architecture settings:"
          grep -E "CONFIG_ARCH_QCOM=|CONFIG_ARM64=" .config || true

      - name: Build ARM64 kernel for Snapdragon 850
        run: |
          cd kernel-source
          
          # Set cross-compilation environment
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Get number of CPU cores for parallel build
          JOBS=$(nproc)
          
          # Build the kernel
          echo "Building ARM64 kernel with $JOBS parallel jobs..."
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$JOBS
          
          # Build kernel modules
          echo "Building kernel modules..."
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$JOBS modules
          
          # Build device tree blobs for Qualcomm/Snapdragon
          echo "Building device tree blobs..."
          if [ -d arch/arm64/boot/dts/qcom ]; then
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$JOBS dtbs || true
          else
            echo "Warning: Qualcomm device tree source not found, skipping DTB build"
          fi

      - name: Install kernel modules
        run: |
          cd kernel-source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # Install modules to a staging directory
          mkdir -p /tmp/kernel-modules
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- INSTALL_MOD_PATH=/tmp/kernel-modules modules_install

      - name: Package ARM64 kernel
        run: |
          cd kernel-source
          export ARCH=arm64
          
          # Get kernel version
          KERNEL_VERSION=$(make ARCH=arm64 kernelversion)
          echo "Kernel version: $KERNEL_VERSION"
          
          # Create output directory
          mkdir -p ../output
          
          # Copy kernel image (ARM64 uses Image format)
          if [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ../output/Image-$KERNEL_VERSION
            cp arch/arm64/boot/Image ../output/vmlinuz-$KERNEL_VERSION
            echo "Kernel image: Image-$KERNEL_VERSION"
          elif [ -f arch/arm64/boot/Image.gz ]; then
            cp arch/arm64/boot/Image.gz ../output/Image.gz-$KERNEL_VERSION
            echo "Kernel image (gzipped): Image.gz-$KERNEL_VERSION"
          else
            echo "Warning: Kernel image not found in arch/arm64/boot/"
            ls -la arch/arm64/boot/ || true
          fi
          
          # Copy device tree blobs for Snapdragon 850
          if [ -d arch/arm64/boot/dts ]; then
            mkdir -p ../output/dtb
            find arch/arm64/boot/dts -name "*.dtb" -exec cp {} ../output/dtb/ \;
            echo "Device tree blobs copied to output/dtb/"
            ls -la ../output/dtb/ | head -10
          fi
          
          # Copy kernel modules
          if [ -d /tmp/kernel-modules/lib/modules ]; then
            mkdir -p ../output/modules
            cp -r /tmp/kernel-modules/lib/modules/* ../output/modules/
            echo "Kernel modules copied to output/modules/"
          fi
          
          # Copy config file
          cp .config ../output/config-$KERNEL_VERSION
          echo "Kernel config saved: config-$KERNEL_VERSION"
          
          # Create a summary file
          cat > ../output/build-info.txt << EOF
          Kernel Version: $KERNEL_VERSION
          Architecture: ARM64
          Target: Snapdragon 850
          ACPI Enabled: Yes
          ACPI Parking Protocol: Yes
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
          cat ../output/build-info.txt

      - name: Upload ARM64 kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian12-arm64-snapdragon850-kernel
          path: |
            output/Image-*
            output/vmlinuz-*
            output/config-*
            output/dtb/**
            output/modules/**
            output/build-info.txt

