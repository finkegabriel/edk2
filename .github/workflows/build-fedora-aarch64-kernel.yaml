name: Build Fedora ARM64 Kernel with ACPI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Fedora version (e.g., 40, 41, 42). Note: 43 may not be released yet.'
        required: false
        type: string
        default: '40'

jobs:
  build-fedora-kernel:
    runs-on: ubuntu-latest
    container:
      image: debian:12
      options: --privileged

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            git \
            wget \
            curl \
            xz-utils \
            cpio \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            rsync \
            python3 \
            kmod \
            grub-common \
            dosfstools \
            mtools \
            parted \
            e2fsprogs \
            qemu-utils \
            libguestfs-tools \
            guestfs-tools \
            kpartx \
            dmsetup \
            parted \
            fdisk

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Fedora kernel source
        run: |
          FEDORA_VERSION="${{ inputs.fedora_version }}"
          echo "Fetching Fedora $FEDORA_VERSION kernel source..."
          
          # Try to get Fedora kernel source from koji or git
          # Option 1: Try Fedora's kernel git repository (if available)
          if [ ! -d kernel-source ]; then
            echo "Attempting to clone Fedora kernel from git..."
            # Fedora kernel git repo (if it exists)
            git clone --depth 1 https://src.fedoraproject.org/kernel/linux.git kernel-source 2>/dev/null || \
            git clone --depth 1 https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git kernel-source 2>/dev/null || true
          fi
          
          # Option 2: Try downloading from Fedora koji
          if [ ! -d kernel-source ] || [ ! -f kernel-source/Makefile ]; then
            echo "Attempting to download kernel source from Fedora koji..."
            # Try to get kernel version from Fedora koji API
            KERNEL_VERSION=$(curl -s "https://kojipkgs.fedoraproject.org/packages/kernel/${FEDORA_VERSION}/" 2>/dev/null | grep -oP 'kernel-\K[0-9]+\.[0-9]+' | head -1 || echo "")
            
            if [ -n "$KERNEL_VERSION" ]; then
              echo "Found kernel version: $KERNEL_VERSION"
              # Try to download kernel source RPM
              KERNEL_SRPM_URL="https://kojipkgs.fedoraproject.org/packages/kernel/${FEDORA_VERSION}/latest/src/kernel-${KERNEL_VERSION}-*.src.rpm"
              echo "Attempting to download from: $KERNEL_SRPM_URL"
              # This is complex, so we'll skip it for now
            fi
          fi
          
          # Option 3: Use mainline Linux kernel (most reliable)
          if [ ! -d kernel-source ] || [ ! -f kernel-source/Makefile ]; then
            echo "Using mainline Linux kernel (stable branch)..."
            if [ -d kernel-source ]; then
              rm -rf kernel-source
            fi
            # Use a recent stable kernel version (v6.6+ includes sdm850-samsung-w737.dts)
            git clone --depth 1 --branch v6.6 https://github.com/torvalds/linux.git kernel-source || \
            git clone --depth 1 https://github.com/torvalds/linux.git kernel-source
          fi
          
          # Verify kernel source
          if [ ! -f kernel-source/Makefile ]; then
            echo "ERROR: Kernel source Makefile not found"
            exit 1
          fi
          
          echo "Kernel source ready:"
          ls -la kernel-source/ | head -10
          echo ""
          echo "Kernel version info:"
          head -5 kernel-source/Makefile | grep -E "VERSION|PATCHLEVEL|SUBLEVEL" || true

      - name: Setup kernel configuration for ARM64 with ACPI
        run: |
          cd kernel-source
          
          # Set cross-compilation environment
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Create or update .config file
          if [ -f .config ]; then
            echo "Using existing .config"
          else
            echo "Creating ARM64 defconfig..."
            # Try different defconfig targets
            if make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- help 2>/dev/null | grep -q defconfig; then
              make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig || true
            elif [ -f arch/arm64/configs/defconfig ]; then
              cp arch/arm64/configs/defconfig .config
            elif [ -f arch/arm64/configs/arm64_defconfig ]; then
              cp arch/arm64/configs/arm64_defconfig .config
            else
              echo "No defconfig found, creating minimal config..."
              printf "CONFIG_ARM64=y\nCONFIG_ACPI=n\nCONFIG_ARM64_ACPI_PARKING_PROTOCOL=n\nCONFIG_OF=y\nCONFIG_OF_FLATTREE=y\nCONFIG_OF_EARLY_FLATTREE=y\nCONFIG_ARCH_QCOM=y\nCONFIG_MSM_GCC_8998=y\nCONFIG_QCOM_SMEM=y\nCONFIG_QCOM_SMD=y\nCONFIG_QCOM_SCM=y\nCONFIG_QCOM_CLK=y\nCONFIG_SERIAL_MSM=y\nCONFIG_SERIAL_MSM_CONSOLE=y\n" > .config
            fi
          fi
          
          # Enable required ACPI options using sed
          echo "Enabling ACPI configuration options..."
          
          # Function to set config option
          set_config() {
            local option=$1
            local value=$2
            if grep -q "^${option}=" .config 2>/dev/null; then
              # Option exists, update it
              sed -i "s|^${option}=.*|${option}=${value}|" .config
            else
              # Option doesn't exist, add it
              echo "${option}=${value}" >> .config
            fi
          }
          
          # Disable ACPI options
          set_config "CONFIG_ACPI" "n"
          set_config "CONFIG_ARM64_ACPI_PARKING_PROTOCOL" "n"
          set_config "CONFIG_ACPI_TABLE_UPGRADE" "n"
          
          # Enable EFI options
          set_config "CONFIG_EFI" "y"
          set_config "CONFIG_EFI_STUB" "y"
          set_config "CONFIG_EFI_MIXED" "y"
          
          # Enable DMI support
          set_config "CONFIG_DMI" "y"
          
          # Enable device tree support
          set_config "CONFIG_OF" "y"
          set_config "CONFIG_OF_FLATTREE" "y"
          set_config "CONFIG_OF_EARLY_FLATTREE" "y"
          
          # Enable Qualcomm architecture support
          set_config "CONFIG_ARCH_QCOM" "y"
          set_config "CONFIG_MSM_GCC_8998" "y"
          set_config "CONFIG_QCOM_SMEM" "y"
          set_config "CONFIG_QCOM_SMD" "y"
          set_config "CONFIG_QCOM_SCM" "y"
          set_config "CONFIG_QCOM_CLK" "y"
          
          # Enable Qualcomm serial support
          set_config "CONFIG_SERIAL_MSM" "y"
          set_config "CONFIG_SERIAL_MSM_CONSOLE" "y"
          
          # If scripts/config exists, use it for verification
          if [ -f scripts/config ]; then
            echo "Using scripts/config for additional configuration..."
            ./scripts/config --file .config --disable CONFIG_ACPI || true
            ./scripts/config --file .config --disable CONFIG_ARM64_ACPI_PARKING_PROTOCOL || true
            ./scripts/config --file .config --disable CONFIG_ACPI_TABLE_UPGRADE || true
            ./scripts/config --file .config --enable CONFIG_EFI || true
            ./scripts/config --file .config --enable CONFIG_EFI_STUB || true
            ./scripts/config --file .config --enable CONFIG_EFI_MIXED || true
            ./scripts/config --file .config --enable CONFIG_DMI || true
            ./scripts/config --file .config --enable CONFIG_OF || true
            ./scripts/config --file .config --enable CONFIG_OF_FLATTREE || true
            ./scripts/config --file .config --enable CONFIG_OF_EARLY_FLATTREE || true
            ./scripts/config --file .config --enable CONFIG_ARCH_QCOM || true
            ./scripts/config --file .config --enable CONFIG_MSM_GCC_8998 || true
            ./scripts/config --file .config --enable CONFIG_QCOM_SMEM || true
            ./scripts/config --file .config --enable CONFIG_QCOM_SMD || true
            ./scripts/config --file .config --enable CONFIG_QCOM_SCM || true
            ./scripts/config --file .config --enable CONFIG_QCOM_CLK || true
            ./scripts/config --file .config --enable CONFIG_SERIAL_MSM || true
            ./scripts/config --file .config --enable CONFIG_SERIAL_MSM_CONSOLE || true
          fi
          
          # Verify the configuration
          echo "Verifying configuration..."
          echo "ACPI settings:"
          grep -E "CONFIG_ACPI=|CONFIG_ARM64_ACPI_PARKING_PROTOCOL=|CONFIG_ACPI_TABLE_UPGRADE=" .config || echo "Warning: Some ACPI configs not found"
          echo ""
          echo "EFI settings:"
          grep -E "CONFIG_EFI=|CONFIG_EFI_STUB=|CONFIG_EFI_MIXED=" .config || echo "Warning: Some EFI configs not found"
          echo ""
          echo "DMI settings:"
          grep -E "CONFIG_DMI=" .config || echo "Warning: DMI config not found"
          echo ""
          echo "Device Tree settings:"
          grep -E "CONFIG_OF=|CONFIG_OF_FLATTREE=|CONFIG_OF_EARLY_FLATTREE=" .config || echo "Warning: Some Device Tree configs not found"
          echo ""
          echo "Qualcomm architecture settings:"
          grep -E "CONFIG_ARCH_QCOM=|CONFIG_MSM_GCC_8998=|CONFIG_QCOM_SMEM=|CONFIG_QCOM_SMD=|CONFIG_QCOM_SCM=|CONFIG_QCOM_CLK=" .config || echo "Warning: Some Qualcomm configs not found"
          echo ""
          echo "Qualcomm serial settings:"
          grep -E "CONFIG_SERIAL_MSM=|CONFIG_SERIAL_MSM_CONSOLE=" .config || echo "Warning: Some serial configs not found"
          echo ""
          echo "Architecture settings:"
          grep -E "CONFIG_ARM64=" .config || true

      - name: Build ARM64 kernel
        run: |
          cd kernel-source
          
          # Verify Makefile exists
          if [ ! -f Makefile ]; then
            echo "ERROR: Makefile not found. Cannot build kernel."
            exit 1
          fi
          
          # Set cross-compilation environment
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Get number of CPU cores for parallel build
          JOBS=$(nproc)
          
          # Verify .config exists
          if [ ! -f .config ]; then
            echo "ERROR: .config file not found."
            exit 1
          fi
          
          # Build the kernel
          echo "Building ARM64 kernel with $JOBS parallel jobs..."
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$JOBS Image
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$JOBS modules
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$JOBS dtbs
          
          # Verify DTB was built (sdm850-samsung-w737.dtb is built as part of dtbs target)
          echo "Checking for sdm850-samsung-w737.dtb..."
          if [ -f arch/arm64/boot/dts/qcom/sdm850-samsung-w737.dtb ]; then
            echo "DTB built successfully: arch/arm64/boot/dts/qcom/sdm850-samsung-w737.dtb"
            ls -lh arch/arm64/boot/dts/qcom/sdm850-samsung-w737.dtb
          else
            echo "WARNING: DTB file not found after build"
            echo "Available Qualcomm DTBs:"
            ls arch/arm64/boot/dts/qcom/*.dtb 2>/dev/null | head -20 || echo "No DTBs found in qcom directory"
          fi

      - name: Download Fedora raw image
        run: |
          FEDORA_VERSION="${{ inputs.fedora_version }}"
          echo "Downloading Fedora $FEDORA_VERSION raw image for aarch64..."
          
          # Check if version is likely valid (Fedora typically releases versions 30-42 as of 2024)
          # Note: This is a rough check, adjust as needed
          VERSION_NUM=$(echo "$FEDORA_VERSION" | grep -oE '^[0-9]+$' || echo "")
          if [ -n "$VERSION_NUM" ]; then
            if [ "$VERSION_NUM" -gt 50 ] || [ "$VERSION_NUM" -lt 30 ]; then
              echo "WARNING: Fedora version $FEDORA_VERSION may not exist"
              echo "Common Fedora versions: 38, 39, 40, 41, 42"
              echo "Continuing anyway..."
            fi
          fi
          
          # Base URL for Fedora images
          BASE_URL="https://mirror.servaxnet.com/fedora/linux/releases/${FEDORA_VERSION}/Cloud/aarch64/images/"
          SECONDARY_URL="https://mirror.servaxnet.com/fedora-secondary/releases/${FEDORA_VERSION}/Cloud/aarch64/images/"
          
          # Try to discover the actual filename by checking available files
          echo "Attempting to discover available raw images..."
          
          # Function to try downloading with a specific filename pattern
          try_download() {
            local url=$1
            local filename=$2
            echo "Trying: $url$filename"
            if wget --spider --timeout=5 "$url$filename" 2>&1 | grep -q "200 OK"; then
              echo "Found: $filename"
              wget -O fedora-raw.xz "$url$filename"
              return 0
            fi
            return 1
          }
          
          # Try different filename patterns
          DOWNLOADED=0
          
          # Pattern 1: Fedora-Workstation-VERSION-RELEASE.VERSION.aarch64.raw.xz
          for release in 1 2 3 4 5; do
            for pattern in "${FEDORA_VERSION}-${release}.${FEDORA_VERSION}" "${FEDORA_VERSION}-${release}"; do
              if try_download "$BASE_URL" "Fedora-Workstation-${pattern}.aarch64.raw.xz"; then
                DOWNLOADED=1
                break 2
              fi
            done
          done
          
          # Pattern 2: Try with different release number formats
          if [ $DOWNLOADED -eq 0 ]; then
            for pattern in "${FEDORA_VERSION}-1" "${FEDORA_VERSION}-1.${FEDORA_VERSION}" "Rawhide-${FEDORA_VERSION}"; do
              if try_download "$BASE_URL" "Fedora-Workstation-${pattern}.aarch64.raw.xz"; then
                DOWNLOADED=1
                break
              fi
            done
          fi
          
          # Try secondary URL
          if [ $DOWNLOADED -eq 0 ]; then
            echo "Trying secondary URL..."
            for release in 1 2 3 4 5; do
              for pattern in "${FEDORA_VERSION}-${release}.${FEDORA_VERSION}" "${FEDORA_VERSION}-${release}"; do
                if try_download "$SECONDARY_URL" "Fedora-Workstation-${pattern}.aarch64.raw.xz"; then
                  DOWNLOADED=1
                  break 2
                fi
              done
            done
          fi
          
          # Try to list directory and find any .raw.xz file
          if [ $DOWNLOADED -eq 0 ]; then
            echo "Attempting to list directory contents..."
            # Try to get directory listing (may not work on all servers)
            LISTING=$(curl -s -L --max-time 10 "$BASE_URL" 2>/dev/null | grep -oP 'href="\K[^"]*\.raw\.xz' | head -1 || echo "")
            if [ -n "$LISTING" ]; then
              echo "Found file in listing: $LISTING"
              if wget -O fedora-raw.xz "$BASE_URL$LISTING"; then
                DOWNLOADED=1
              fi
            fi
          fi
          
          # Try checking what versions are actually available
          if [ $DOWNLOADED -eq 0 ]; then
            echo ""
            echo "ERROR: Could not download Fedora $FEDORA_VERSION raw image"
            echo "Tried multiple patterns and locations"
            echo ""
            echo "Fedora $FEDORA_VERSION may not be released yet."
            echo "Please try a valid Fedora version (e.g., 38, 39, 40, 41, 42)"
            echo ""
            echo "You can check available versions at:"
            echo "  https://download.fedoraproject.org/pub/fedora/linux/releases/"
            echo ""
            echo "Or use workflow_dispatch with a valid fedora_version input"
            echo ""
            echo "To use a different version, trigger the workflow manually and specify:"
            echo "  fedora_version: 40  (or another valid version)"
            exit 1
          fi
          
          echo "Extracting raw image..."
          xz -d fedora-raw.xz || unxz fedora-raw.xz
          ls -lh fedora-raw

      - name: Prepare modified Fedora image
        run: |
          # Create a copy of the raw image to modify
          cp fedora-raw fedora-raw-modified
          
          # Create loop devices if they don't exist
          echo "Setting up loop devices..."
          # Check if we're in a container that needs loop devices
          if [ ! -e /dev/loop0 ]; then
            echo "Creating loop devices..."
            for i in 0 1 2 3 4 5 6 7; do
              mknod -m 0660 /dev/loop$i b 7 $i 2>/dev/null || true
            done
          fi
          
          # Verify loop devices are available
          ls -la /dev/loop* | head -5
          
          echo "Image prepared for modification"
          ls -lh fedora-raw-modified

      - name: Install custom kernel and modify GRUB using guestfish
        run: |
          cd kernel-source
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Get kernel version info
          KERNEL_VERSION=$(make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelversion | tr -d ' ')
          KERNEL_RELEASE=$(make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease | tr -d ' ')
          
          echo "Kernel version: $KERNEL_VERSION"
          echo "Kernel release: $KERNEL_RELEASE"
          
          # Create a script to modify the image using guestfish
          cat > modify_image.sh << 'EOFSCRIPT'
          #!/bin/bash
          IMAGE=$1
          KERNEL_RELEASE=$2
          KERNEL_IMAGE=$3
          
          # Use guestfish to modify the image
          guestfish --rw -a "$IMAGE" << 'GUESTFISH'
          run
          
          # List partitions
          list-partitions
          
          # Mount root filesystem (usually the last partition)
          mount /dev/sda3 / || mount /dev/sda2 / || mount /dev/sda1 /
          
          # Copy kernel image
          copy-in "$KERNEL_IMAGE" /boot/
          
          # Find and modify GRUB config
          sh "find /boot -name grub.cfg -o -name grub2.cfg | head -1" > /tmp/grubcfg
          GRUB_CFG=$(cat /tmp/grubcfg)
          
          if [ -n "$GRUB_CFG" ]; then
            # Read current GRUB config
            read-file "$GRUB_CFG" > /tmp/grub_content
            
            # Modify to disable secure boot
            sed -i 's/set check_signatures=enforce/set check_signatures=no/g' /tmp/grub_content
            sed -i 's/set check_signatures=yes/set check_signatures=no/g' /tmp/grub_content
            
            # Write back
            write-file "$GRUB_CFG" /tmp/grub_content
          fi
          
          # Modify GRUB environment if it exists
          if [ -f /boot/efi/EFI/fedora/grubenv ]; then
            read-file /boot/efi/EFI/fedora/grubenv > /tmp/grubenv
            sed -i 's/check_signatures=enforce/check_signatures=no/g' /tmp/grubenv
            write-file /boot/efi/EFI/fedora/grubenv /tmp/grubenv
          fi
          
          umount-all
          GUESTFISH
          EOFSCRIPT
          
          chmod +x modify_image.sh
          
          # Alternative: Use simpler approach with virt-customize if available
          # For now, we'll use a manual mount approach
          echo "Preparing to modify image..."
          
          # Create mount script that will be run with proper privileges
          cat > mount_and_modify.sh << 'MOUNTSCRIPT'
          #!/bin/bash
          set -e
          
          IMAGE="$1"
          KERNEL_IMAGE="$2"
          KERNEL_RELEASE="$3"
          KERNEL_SOURCE="$4"
          DTB_FILE="$5"
          
          # Use kpartx directly - more reliable in containers
          echo "Using kpartx to map partitions..."
          if ! command -v kpartx >/dev/null 2>&1; then
            echo "ERROR: kpartx not available"
            exit 1
          fi
          
          # Map partitions using kpartx
          kpartx -av "$IMAGE"
          sleep 2
          
          # Find all mapped partitions
          echo "Mapped partitions:"
          dmsetup ls | grep loop || true
          
          # Get the loop device name from kpartx output
          LOOP_BASE=$(dmsetup ls | grep loop | head -1 | awk '{print $1}' | sed 's/-p[0-9]*$//' || echo "")
          
          # Try to find root partition (usually partition 3, the largest)
          ROOT_PART=""
          
          # Check partition 3 first (usually root)
          for mapper_dev in /dev/mapper/${LOOP_BASE}-p3 /dev/mapper/loop*p3; do
            if [ -b "$mapper_dev" ] 2>/dev/null; then
              FSTYPE=$(blkid -s TYPE -o value "$mapper_dev" 2>/dev/null || echo "")
              if [ "$FSTYPE" = "ext4" ] || [ "$FSTYPE" = "xfs" ] || [ "$FSTYPE" = "btrfs" ]; then
                ROOT_PART="$mapper_dev"
                echo "Found root partition: $ROOT_PART (type: $FSTYPE)"
                break
              fi
            fi
          done
          
          # If not found, try all partitions
          if [ -z "$ROOT_PART" ]; then
            echo "Searching all partitions..."
            for mapper_dev in /dev/mapper/${LOOP_BASE}-p* /dev/mapper/loop*p*; do
              if [ -b "$mapper_dev" ] 2>/dev/null; then
                FSTYPE=$(blkid -s TYPE -o value "$mapper_dev" 2>/dev/null || echo "")
                SIZE=$(blockdev --getsize64 "$mapper_dev" 2>/dev/null || echo "0")
                echo "  Checking: $mapper_dev (type: $FSTYPE, size: $SIZE)"
                # Prefer larger ext4/xfs partitions (likely root)
                if [ "$FSTYPE" = "ext4" ] || [ "$FSTYPE" = "xfs" ] || [ "$FSTYPE" = "btrfs" ]; then
                  if [ -z "$ROOT_PART" ] || [ "$SIZE" -gt "$(blockdev --getsize64 "$ROOT_PART" 2>/dev/null || echo 0)" ]; then
                    ROOT_PART="$mapper_dev"
                    echo "  Selected as root: $ROOT_PART"
                  fi
                fi
              fi
            done
          fi
          
          # Fallback: use largest partition
          if [ -z "$ROOT_PART" ]; then
            echo "Fallback: using largest partition..."
            LARGEST_SIZE=0
            for mapper_dev in /dev/mapper/${LOOP_BASE}-p* /dev/mapper/loop*p*; do
              if [ -b "$mapper_dev" ] 2>/dev/null; then
                SIZE=$(blockdev --getsize64 "$mapper_dev" 2>/dev/null || echo "0")
                if [ "$SIZE" -gt "$LARGEST_SIZE" ]; then
                  LARGEST_SIZE=$SIZE
                  ROOT_PART="$mapper_dev"
                fi
              fi
            done
          fi
          
          if [ -z "$ROOT_PART" ] || [ ! -b "$ROOT_PART" ]; then
            echo "ERROR: Could not find root partition"
            echo "Available mapper devices:"
            ls -la /dev/mapper/loop* 2>/dev/null || true
            dmsetup ls | grep loop || true
            kpartx -d "$IMAGE" || true
            exit 1
          fi
          
          echo "Using root partition: $ROOT_PART"
          
          # Mount root
          mkdir -p /mnt/fedora
          mount "$ROOT_PART" /mnt/fedora
          
          # Copy kernel
          mkdir -p /mnt/fedora/boot
          cp "$KERNEL_IMAGE" /mnt/fedora/boot/vmlinuz-${KERNEL_RELEASE}
          
          # Copy DTB file if provided
          if [ -n "$DTB_FILE" ] && [ -f "$DTB_FILE" ]; then
            echo "Copying DTB file: $DTB_FILE"
            mkdir -p /mnt/fedora/boot/dtb
            cp "$DTB_FILE" /mnt/fedora/boot/dtb/
            echo "DTB copied to /mnt/fedora/boot/dtb/$(basename $DTB_FILE)"
          else
            echo "Warning: DTB file not provided or not found: $DTB_FILE"
          fi
          
          # Modify GRUB config
          for grubcfg in /mnt/fedora/boot/efi/EFI/fedora/grub.cfg /mnt/fedora/boot/grub2/grub.cfg /mnt/fedora/boot/grub/grub.cfg; do
            if [ -f "$grubcfg" ]; then
              echo "Modifying: $grubcfg"
              sed -i 's/set check_signatures=enforce/set check_signatures=no/g' "$grubcfg"
              sed -i 's/set check_signatures=yes/set check_signatures=no/g' "$grubcfg"
              # Add disable secure boot at the beginning of each menuentry
              sed -i '/^menuentry/a\  set check_signatures=no' "$grubcfg"
            fi
          done
          
          # Modify GRUB environment
          for grubenv in /mnt/fedora/boot/efi/EFI/fedora/grubenv /mnt/fedora/boot/grub2/grubenv; do
            if [ -f "$grubenv" ]; then
              echo "Modifying: $grubenv"
              sed -i 's/check_signatures=enforce/check_signatures=no/g' "$grubenv" || true
            fi
          done
          
          # Install kernel modules
          if [ -n "$KERNEL_SOURCE" ] && [ -d "$KERNEL_SOURCE" ]; then
            echo "Installing kernel modules..."
            cd "$KERNEL_SOURCE"
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- INSTALL_MOD_PATH=/mnt/fedora modules_install
            cd - > /dev/null
          else
            echo "Warning: Kernel source directory not provided, skipping modules installation"
          fi
          
          # Unmount and cleanup
          umount /mnt/fedora
          kpartx -d "$IMAGE" || true
          MOUNTSCRIPT
          
          chmod +x mount_and_modify.sh
          
          # Run the modification script
          ./mount_and_modify.sh ../fedora-raw-modified arch/arm64/boot/Image "$KERNEL_RELEASE" "$(pwd)" arch/arm64/boot/dts/qcom/sdm850-samsung-w737.dtb

      - name: Cleanup and package
        run: |
          # Ensure no mounts are left
          umount /mnt/fedora 2>/dev/null || true
          
          # Clean up any loop devices
          for loop in $(losetup -j fedora-raw-modified 2>/dev/null | cut -d: -f1); do
            losetup -d "$loop" 2>/dev/null || true
          done
          
          # Compress the modified image
          echo "Compressing modified image..."
          xz -9 fedora-raw-modified
          
          echo "Modified image ready: fedora-raw-modified.xz"
          ls -lh fedora-raw-modified.xz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
