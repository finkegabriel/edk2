name: Fedora aarch64 raw build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          gcc-aarch64-linux-gnu \
          qemu-user-static \
          git \
          bison \
          flex \
          libssl-dev \
          bc \
          dwarves \
          grub-efi-arm64-bin

    - name: Clone Fedora kernel
      run: |
        git clone --depth=1 https://src.fedoraproject.org/rpms/kernel.git fedora-kernel

    - name: Configure kernel
      working-directory: fedora-kernel
      run: |
        make ARCH=arm64 defconfig
        scripts/config --enable CONFIG_ACPI
        scripts/config --enable CONFIG_ARM64_ACPI_PARKING_PROTOCOL
        scripts/config --enable CONFIG_EFI
        scripts/config --enable CONFIG_EFI_STUB
        scripts/config --enable CONFIG_ACPI_TABLE_UPGRADE
        make ARCH=arm64 olddefconfig

    - name: Build kernel
      working-directory: fedora-kernel
      run: |
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

    - name: Build unsigned GRUB (EFI)
      run: |
        grub-mkstandalone \
          -O arm64-efi \
          -o grubaa64.efi \
          "boot/grub/grub.cfg=/dev/null"

    - name: Assemble boot tree
      run: |
        mkdir -p image/EFI/BOOT image/boot
        cp grubaa64.efi image/EFI/BOOT/BOOTAA64.EFI
        cp fedora-kernel/arch/arm64/boot/Image image/boot/vmlinuz

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fedora-aarch64-raw
        path: image
