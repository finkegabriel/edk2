name: Build ARM64 UEFI EFI

# Trigger manually or on push
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # GitHub runner
    container:
      image: debian:12  # Use Debian 12 (bookworm) to ensure arm64 packages exist

    steps:
      # Install git and CA certificates first (needed for checkout with submodules)
      - name: Install git and CA certificates
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      # Checkout repo with submodules
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Add ARM64 architecture and update packages
      - name: Setup ARM64 multiarch
        run: |
          dpkg --add-architecture arm64
          apt-get update

      # Install EDK2 build dependencies
      - name: Install EDK2 build tools
        run: |
          apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev:arm64 \
            make \
            python3 \
            python3-distutils \
            uuid-dev \
            file
          # Create python symlink for EDK2 build scripts
          ln -sf /usr/bin/python3 /usr/bin/python

      # Build BaseTools
      - name: Build EDK2 BaseTools
        run: |
          cd BaseTools
          # Disable problematic warning errors for GCC 12+ compatibility
          # Add -Wno-error flags to BUILD_CFLAGS in header.makefile
          sed -i 's/-Wno-unused-result -nostdlib/-Wno-unused-result -Wno-error=vla-parameter -Wno-error=use-after-free -Wno-error=dangling-pointer -Wno-error=stringop-overflow -nostdlib/g' Source/C/Makefiles/header.makefile
          # Build BaseTools (continue on errors to skip optional Tests target)
          make -k || true
          cd ..

      # Fix Python 3 compatibility issues
      - name: Fix Python 3 compatibility
        run: |
          # Replace array.tostring() with array.tobytes() for Python 3.9+ compatibility
          find BaseTools/Source/Python -name "*.py" -type f -exec sed -i 's/\.tostring()/\.tobytes()/g' {} \;

      # Verify required files exist and fix if needed
      - name: Verify and fix ShellPkg files
        run: |
          echo "Checking for required ShellPkg files..."
          ls -la ShellPkg/Library/UefiHandleParsingLib/UefiHandleParsingLib.uni || echo "UefiHandleParsingLib.uni not found"
          ACPI_UNI="ShellPkg/Library/UefiShellAcpiViewCommandLib/UefiShellAcpiViewCommandLib.uni"
          if [ -f "$ACPI_UNI" ]; then
            echo "File exists: $ACPI_UNI"
            ls -la "$ACPI_UNI"
            # Check if file is readable
            if [ ! -r "$ACPI_UNI" ]; then
              echo "File exists but is not readable, fixing permissions..."
              chmod 644 "$ACPI_UNI"
            fi
          else
            echo "WARNING: $ACPI_UNI not found, checking case sensitivity..."
            find ShellPkg/Library/UefiShellAcpiViewCommandLib -iname "*.uni" || echo "No .uni files found in directory"
          fi

      # Temporarily exclude problematic library from ShellPkg.dsc
      - name: Exclude UefiShellAcpiViewCommandLib from build
        run: |
          # Comment out the problematic library in ShellPkg.dsc
          sed -i 's|^  ShellPkg/Library/UefiShellAcpiViewCommandLib/UefiShellAcpiViewCommandLib.inf|  # ShellPkg/Library/UefiShellAcpiViewCommandLib/UefiShellAcpiViewCommandLib.inf|' ShellPkg/ShellPkg.dsc

      # Setup EDK2 environment and build
      - name: Build EDK2 modules
        shell: bash
        run: |
          export PYTHON3_ENABLE=1
          export GCC5_AARCH64_PREFIX=aarch64-linux-gnu-
          source edksetup.sh
          build -b DEBUG -a AARCH64 -t GCC5 -p EmbeddedPkg/EmbeddedPkg.dsc -m EmbeddedPkg/Application/ConfigTableLoader/DtbLoader.inf
          # Build ShellPkg platform (builds all components including Shell.efi)
          # Using NO_SHELL_PROFILES to skip optional components that might have issues
          build -b DEBUG -a AARCH64 -t GCC5 -p ShellPkg/ShellPkg.dsc -D NO_SHELL_PROFILES

      # Locate and verify built EFI files
      - name: Locate built EFI files
        run: |
          echo "=== Searching for built EFI files ==="
          find Build -name "*.efi" -type f || echo "No EFI files found"
          echo ""
          echo "=== DtbLoader.efi ==="
          find Build -name "DtbLoader.efi" -type f || echo "DtbLoader.efi not found"
          echo ""
          echo "=== Shell.efi ==="
          find Build -name "Shell.efi" -type f || echo "Shell.efi not found"

      # Upload artifacts
      - name: Upload EFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edk2-arm64-efi
          path: |
            Build/**/DtbLoader.efi
            Build/**/Shell.efi
          if-no-files-found: error
