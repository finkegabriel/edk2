name: Build ARM64 UEFI EFI

# Trigger manually or on push
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # GitHub runner
    container:
      image: debian:12  # Use Debian 12 (bookworm) to ensure arm64 packages exist

    steps:
      # Checkout repo
      - name: Checkout source
        uses: actions/checkout@v4

      # Add ARM64 architecture and update packages
      - name: Setup ARM64 multiarch
        run: |
          dpkg --add-architecture arm64
          apt-get update

      # Install cross toolchain and ARM64 gnu-efi
      - name: Install ARM64 build tools
        run: |
          apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gnu-efi:arm64 \
            make \
            file \
            git

      # Verify CRT exists (check multiple possible locations)
      - name: Verify CRT
        run: |
          CRT0=$(find /usr/lib* -name "crt0-efi-aarch64.o" 2>/dev/null | head -1)
          if [ -z "$CRT0" ]; then
            echo "ERROR: crt0-efi-aarch64.o not found in any expected location"
            echo "Searching in: /usr/lib/aarch64-linux-gnu/gnu-efi /usr/lib/gnu-efi /usr/lib64/gnu-efi"
            find /usr/lib* -name "*gnu-efi*" -type d 2>/dev/null || true
            exit 1
          fi
          echo "Found CRT0 at: $CRT0"
          ls -l "$CRT0"

      # Build EFI
      - name: Build BOOTAA64.EFI
        run: |
          make clean
          make

      # Verify output
      - name: Verify EFI binary
        run: |
          file BOOTAA64.EFI

      # Upload artifact
      - name: Upload EFI artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOOTAA64.EFI
          path: BOOTAA64.EFI
