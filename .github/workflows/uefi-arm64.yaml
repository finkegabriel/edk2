name: Build ARM64 UEFI EFI Modules

# Trigger manually or on push
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # GitHub runner
    container:
      image: debian:12  # Use Debian 12 (bookworm) to ensure arm64 packages exist

    steps:
      # Install git and CA certificates first (needed for checkout with submodules)
      - name: Install git and CA certificates
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      # Checkout repo with submodules
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
      
      # Ensure all files are properly checked out and accessible
      - name: Verify checkout and fix file permissions
        run: |
          echo "Verifying repository checkout..."
          # Add repository as safe directory for git operations
          git config --global --add safe.directory /__w/edk2/edk2 || true
          git status || echo "Git status check skipped"
          echo ""
          echo "Checking for ShellPkg files..."
          if [ -d "ShellPkg" ]; then
            echo "ShellPkg directory exists"
            UNI_COUNT=$(find ShellPkg -type f -name "*.uni" | wc -l)
            echo "Found $UNI_COUNT UNI files"
          else
            echo "ERROR: ShellPkg directory not found!"
            exit 1
          fi
          # Ensure all files are readable
          find ShellPkg -type f -exec chmod 644 {} \; || true

      # Add ARM64 architecture and update packages
      - name: Setup ARM64 multiarch
        run: |
          dpkg --add-architecture arm64
          apt-get update

      # Install EDK2 build dependencies
      - name: Install EDK2 build tools
        run: |
          apt-get install -y --no-install-recommends \
            build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev:arm64 \
            make \
            python3 \
            python3-distutils \
            uuid-dev \
            file
          # Create python symlink for EDK2 build scripts
          ln -sf /usr/bin/python3 /usr/bin/python

      # Build BaseTools
      - name: Build EDK2 BaseTools
        run: |
          cd BaseTools
          # Disable problematic warning errors for GCC 12+ compatibility
          # Add -Wno-error flags to BUILD_CFLAGS in header.makefile
          sed -i 's/-Wno-unused-result -nostdlib/-Wno-unused-result -Wno-error=vla-parameter -Wno-error=use-after-free -Wno-error=dangling-pointer -Wno-error=stringop-overflow -nostdlib/g' Source/C/Makefiles/header.makefile
          # Build BaseTools (continue on errors to skip optional Tests target)
          make -k || true
          cd ..

      # Fix Python 3 compatibility issues
      - name: Fix Python 3 compatibility
        run: |
          # Replace array.tostring() with array.tobytes() for Python 3.9+ compatibility
          find BaseTools/Source/Python -name "*.py" -type f -exec sed -i 's/\.tostring()/\.tobytes()/g' {} \;

      # Verify required files exist and fix if needed
      - name: Verify and fix ShellPkg files
        run: |
          echo "=== Checking ShellPkg files ==="
          HANDLE_UNI="ShellPkg/Library/UefiHandleParsingLib/UefiHandleParsingLib.uni"
          ACPI_UNI="ShellPkg/Library/UefiShellAcpiViewCommandLib/UefiShellAcpiViewCommandLib.uni"
          
          echo "Checking $HANDLE_UNI..."
          if [ -f "$HANDLE_UNI" ]; then
            echo "✓ File exists: $HANDLE_UNI"
            ls -la "$HANDLE_UNI"
            # Ensure file is readable and has correct permissions
            chmod 644 "$HANDLE_UNI" || true
            # Test if file can be read
            head -1 "$HANDLE_UNI" || echo "ERROR: Cannot read file"
            # Check file encoding and convert to Unix line endings if needed
            file "$HANDLE_UNI" || true
            # Ensure Unix line endings
            dos2unix "$HANDLE_UNI" 2>/dev/null || sed -i 's/\r$//' "$HANDLE_UNI" || true
          else
            echo "✗ File NOT found: $HANDLE_UNI"
            echo "Searching for similar files..."
            find ShellPkg/Library/UefiHandleParsingLib -type f -name "*.uni" || echo "No .uni files found"
            find ShellPkg/Library/UefiHandleParsingLib -type f || echo "No files found in directory"
            exit 1
          fi
          
          echo ""
          echo "Checking $ACPI_UNI..."
          if [ -f "$ACPI_UNI" ]; then
            echo "✓ File exists: $ACPI_UNI"
            ls -la "$ACPI_UNI"
            chmod 644 "$ACPI_UNI" || true
            dos2unix "$ACPI_UNI" 2>/dev/null || sed -i 's/\r$//' "$ACPI_UNI" || true
          else
            echo "✗ File NOT found: $ACPI_UNI"
          fi
          
          echo ""
          echo "Fixing all .uni files in ShellPkg (permissions, line endings, and encoding)..."
          find ShellPkg -name "*.uni" -type f -exec chmod 644 {} \; || true
          # Convert to UTF-8 without BOM and fix line endings
          for uni_file in $(find ShellPkg -name "*.uni" -type f); do
            # Remove BOM if present, convert to UTF-8, fix line endings
            sed -i '1s/^\xEF\xBB\xBF//' "$uni_file" || true
            sed -i 's/\r$//' "$uni_file" || true
            # Ensure file ends with newline
            [ -s "$uni_file" ] && [ "$(tail -c 1 "$uni_file")" != "" ] && echo >> "$uni_file" || true
          done
          
          echo ""
          echo "Testing file access from Python (EDK2 uses Python)..."
          HANDLE_UNI="ShellPkg/Library/UefiHandleParsingLib/UefiHandleParsingLib.uni"
          python3 -c "import os; f='$HANDLE_UNI'; print('File exists:', os.path.exists(f)); print('Readable:', os.access(f, os.R_OK) if os.path.exists(f) else False); open(f).close() if os.path.exists(f) else None"

      # Temporarily exclude problematic library from ShellPkg.dsc
      - name: Exclude UefiShellAcpiViewCommandLib from build
        run: |
          # Comment out the problematic library in ShellPkg.dsc
          sed -i 's|^  ShellPkg/Library/UefiShellAcpiViewCommandLib/UefiShellAcpiViewCommandLib.inf|  # ShellPkg/Library/UefiShellAcpiViewCommandLib/UefiShellAcpiViewCommandLib.inf|' ShellPkg/ShellPkg.dsc

      # Setup EDK2 environment and build
      - name: Build EDK2 modules
        shell: bash
        run: |
          export PYTHON3_ENABLE=1
          export GCC5_AARCH64_PREFIX=aarch64-linux-gnu-
          source edksetup.sh
          
          # Verify file is still accessible after edksetup.sh
          echo "=== Post-edksetup.sh file verification ==="
          HANDLE_UNI="ShellPkg/Library/UefiHandleParsingLib/UefiHandleParsingLib.uni"
          echo "Current directory after edksetup.sh: $(pwd)"
          echo "WORKSPACE: ${WORKSPACE:-not set}"
          if [ -n "${WORKSPACE}" ]; then
            echo "Checking file from WORKSPACE: ${WORKSPACE}/$HANDLE_UNI"
            ls -la "${WORKSPACE}/$HANDLE_UNI" || echo "File not found from WORKSPACE"
          fi
          echo ""
          
          # Verify file is still accessible right before build
          echo "=== Pre-build file verification ==="
          HANDLE_UNI="ShellPkg/Library/UefiHandleParsingLib/UefiHandleParsingLib.uni"
          ABS_HANDLE_UNI=$(readlink -f "$HANDLE_UNI" || realpath "$HANDLE_UNI" || echo "$(pwd)/$HANDLE_UNI")
          echo "Current directory: $(pwd)"
          echo "Relative path: $HANDLE_UNI"
          echo "Absolute path: $ABS_HANDLE_UNI"
          
          if [ -f "$HANDLE_UNI" ]; then
            echo "✓ File exists before build: $HANDLE_UNI"
            ls -la "$HANDLE_UNI"
            file "$HANDLE_UNI" || true
            # Test opening in binary mode (like EDK2 does)
            python3 -c "import os; f='$HANDLE_UNI'; exists=os.path.exists(f); readable=os.access(f, os.R_OK) if exists else False; print('File exists:', exists, ', readable:', readable); (open(f, 'rb').close() and print('✓ File can be opened in binary mode')) if exists and readable else print('✗ ERROR: Cannot open file')"
            # Ensure file is not a symlink and is a regular file
            if [ -L "$HANDLE_UNI" ]; then
              echo "WARNING: File is a symlink, resolving..."
              REAL_FILE=$(readlink -f "$HANDLE_UNI")
              echo "Real file: $REAL_FILE"
            fi
            # Touch the file to ensure it's definitely there
            touch "$HANDLE_UNI"
            chmod 644 "$HANDLE_UNI"
          else
            echo "✗ File NOT found before build: $HANDLE_UNI"
            echo "Searching for it..."
            find . -name "UefiHandleParsingLib.uni" -type f 2>/dev/null | head -5
            exit 1
          fi
          echo ""
          
          build -b DEBUG -a AARCH64 -t GCC5 -p EmbeddedPkg/EmbeddedPkg.dsc -m EmbeddedPkg/Application/ConfigTableLoader/DtbLoader.inf
          
          # Try building the library first, then Shell
          echo "=== Building UefiHandleParsingLib first ==="
          build -b DEBUG -a AARCH64 -t GCC5 -p ShellPkg/ShellPkg.dsc -m ShellPkg/Library/UefiHandleParsingLib/UefiHandleParsingLib.inf || echo "Library build failed, continuing..."
          
          # Build Shell application module (dependencies will be built automatically)
          # Building just the module should avoid processing all platform components
          build -b DEBUG -a AARCH64 -t GCC5 -p ShellPkg/ShellPkg.dsc -m ShellPkg/Application/Shell/Shell.inf

      # Locate and verify built EFI files
      - name: Locate built EFI files
        run: |
          echo "=== Searching for built EFI files ==="
          find Build -name "*.efi" -type f || echo "No EFI files found"
          echo ""
          echo "=== DtbLoader.efi ==="
          find Build -name "DtbLoader.efi" -type f || echo "DtbLoader.efi not found"
          echo ""
          echo "=== Shell.efi ==="
          find Build -name "Shell.efi" -type f || echo "Shell.efi not found"

      # Upload artifacts
      - name: Upload EFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edk2-arm64-efi
          path: |
            Build/**/DtbLoader.efi
            Build/**/Shell.efi
          if-no-files-found: error
