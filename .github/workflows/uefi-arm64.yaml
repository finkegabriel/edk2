name: Build ARM64 UEFI EFI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      run: |
        sudo apt update
        sudo apt install -y \
          gcc-aarch64-linux-gnu \
          gnu-efi \
          binutils-aarch64-linux-gnu

    - name: Build EFI
      run: |
        make

    - name: Verify output
      run: |
        file BOOTAA64.EFI

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOOTAA64.EFI
        path: BOOTAA64.EFI
