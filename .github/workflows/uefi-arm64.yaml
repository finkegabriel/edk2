name: Build ARM64 UEFI EFI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install ARM64 EFI toolchain
      run: |
        sudo dpkg --add-architecture arm64
        sudo apt update
        sudo apt install -y \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          gnu-efi:arm64 \
          libgnuefi-dev:arm64


    - name: Build EFI
      run: |
        make

    - name: Verify output
      run: |
        file BOOTAA64.EFI

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOOTAA64.EFI
        path: BOOTAA64.EFI
